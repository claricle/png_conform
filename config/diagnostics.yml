# PNG Conform diagnostic requirement catalog.
#
# One stable ID per violated requirement (or informational finding) across
# PNG, APNG, MNG and JNG. Loaded and validated by
# PngConform::Diagnostics::Catalog; coverage of every emitter is proven by
# spec/png_conform/diagnostics/catalog_spec.rb.
#
# requirements:  conformance findings; each carries a specification citation.
# informational: non-conformance messages; deliberately no citation.
# emitters:      the call sites (file relative to lib/png_conform, normalized
#                call text, optional site count) that report the finding.
# abstract:      shared BaseValidator helper findings; never bound to a
#                validator call site (each call site has its own ID).
# excluded_sources: sources inventoried but deliberately not cataloged.
schema_version: 1
specifications:
  iso15948:
    name: "ISO/IEC 15948 Portable Network Graphics (PNG): Functional specification"
    version: "2004 (Second Edition; technically identical to W3C REC-PNG-20031110)"
    url: "https://www.w3.org/TR/2003/REC-PNG-20031110/"
  png3:
    name: "Portable Network Graphics (PNG) Specification (Third Edition)"
    version: "W3C Recommendation 2025-06-24"
    url: "https://www.w3.org/TR/png-3/"
  pngext:
    name: "Extensions to the PNG 1.2 Specification"
    version: "1.5.0"
    url: "https://ftp-osl.osuosl.org/pub/libpng/documents/pngext-1.5.0.html"
  apng:
    name: "APNG Specification"
    version: "1.0 (MozillaWiki)"
    url: "https://wiki.mozilla.org/APNG_Specification"
  mng:
    name: "MNG (Multiple-image Network Graphics) Format"
    version: "1.0 (2001-01-31)"
    url: "http://www.libpng.org/pub/mng/spec/"
  jng:
    name: "JNG (JPEG Network Graphics) Format"
    version: "1.0"
    url: "http://www.libpng.org/pub/mng/spec/jng.html"
  apple_idot:
    name: "Apple iDOT chunk (unpublished vendor extension; no public specification)"
    version: "n/a"
    url: null
  profile:
    name: "png_conform validation profiles (config/validation_profiles.yml)"
    version: "1"
    url: null
requirements:
  all.helper.crc:
    format: all
    kind: integrity
    severity: error
    abstract: true
    emitters:
      - {file: "validators/base_validator.rb", call: "add_error(id, \"CRC error in #{chunk.chunk_type} chunk\", field: \"crc\")"}
  all.helper.enum:
    format: all
    kind: value
    severity: error
    abstract: true
    emitters:
      - {file: "validators/base_validator.rb", call: "add_error(id, \"invalid #{name} (#{value}, must be one of #{valid.join(', ')})\", field: name, expected: valid.join(\", \"), actual: value)"}
  all.helper.length:
    format: all
    kind: length
    severity: error
    abstract: true
    emitters:
      - {file: "validators/base_validator.rb", call: "add_error(id, \"invalid #{chunk.chunk_type} length (#{actual}, should be #{expected})\", field: \"length\", expected: expected, actual: actual)"}
  all.helper.range:
    format: all
    kind: value
    severity: error
    abstract: true
    emitters:
      - {file: "validators/base_validator.rb", call: "add_error(id, \"invalid #{name} (#{value}, must be #{min}-#{max})\", field: name, expected: \"#{min}-#{max}\", actual: value)"}
  apng.acTL.before-fctl:
    format: apng
    kind: ordering
    severity: error
    citation: {specification: apng, section: "2.2", title: "acTL: The Animation Control Chunk"}
    emitters:
      - {file: "validators/apng/actl_validator.rb", call: "add_error(\"apng.acTL.before-fctl\", \"acTL must appear before first fcTL\")"}
