  apng.acTL.crc:
    format: apng
    kind: integrity
    severity: error
    citation: {specification: iso15948, section: "5.5", title: "Cyclic Redundancy Code algorithm"}
    emitters:
      - {file: "validators/apng/actl_validator.rb", call: "check_crc(id: \"apng.acTL.crc\")"}
  apng.acTL.length:
