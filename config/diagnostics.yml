excluded_sources:
  pipelines:
    paths: ["pipelines/"]
    classification: dormant
    decision: exclude
    constants: ["PngConform::Pipelines"]
    reference_pattern: "Pipelines|ValidationPipeline|pipeline_result"
    rationale: >-
      Nothing requires lib/png_conform/pipelines/ and no documented public
      contract names it. Its sequence and signature stages repeat messages
      the active ValidationOrchestrator already emits, which are cataloged as
      png.signature.invalid, png.IHDR.missing, png.IEND.missing and
      png.IDAT.missing. Wiring or cataloging the stages would duplicate those
      IDs for unreachable code.
    evidence:
      - "No require_relative of pipelines/ in lib/png_conform.rb or any file it loads."
      - "PngConform::Pipelines is undefined after requiring png_conform and loading all 47 registered validators."
      - "No reference in spec/, exe/, bin/, examples/, benchmarks/, docs/, README.adoc or Rakefile."
  zlib_validator:
    paths: ["services/zlib_validator.rb"]
    classification: dormant
    decision: exclude
    constants: ["PngConform::Services::ZlibValidator"]
    reference_pattern: "ZlibValidator|zlib_validator"
    rationale: >-
      Services::ZlibValidator is never required and has no spec or
      documentation. The active zlib findings live in the iCCP, zTXt and iTXt
      validators (png.iCCP.decompress, png.zTXt.decompress,
      png.iTXt.decompress) and are cataloged there.
    evidence:
      - "No require of services/zlib_validator in lib/."
      - "PngConform::Services::ZlibValidator is undefined after requiring png_conform."
      - "No reference in spec/, exe/, bin/, examples/, benchmarks/, docs/, README.adoc or Rakefile."
  streaming_idat_validator:
    paths: ["validators/streaming_idat_validator.rb"]
    classification: dormant
    decision: exclude
    constants: ["PngConform::Validators::StreamingIdatValidator"]
    reference_pattern: "StreamingIdatValidator|streaming_idat_validator"
    rationale: >-
      StreamingIdatValidator is not in ChunkRegistry::VALIDATOR_PATHS, is never
      required, and has no spec or documented use. The registered
      IdatValidator is the active IDAT validator and is cataloged.
    evidence:
      - "Absent from ChunkRegistry::VALIDATOR_PATHS (47 entries)."
      - "PngConform::Validators::StreamingIdatValidator is undefined after requiring png_conform and loading all registered validators."
      - "No reference in spec/, exe/, bin/, examples/, benchmarks/, docs/, README.adoc or Rakefile."
  validation_service_helpers:
    paths: ["services/validation_service.rb"]
    classification: private-legacy
    decision: exclude-private-helpers
    private_helpers: ["add_error", "add_warning", "add_info", "merge_results"]
    uncalled_helpers: ["merge_results"]
    rationale: >-
      ValidationService is a documented public facade (ValidationService
      .validate_file and #validate, docs/CLI_OPTIONS.adoc), but both delegate
      to ValidationOrchestrator, whose findings are cataloged. Its private
      add_error, add_warning, add_info and merge_results helpers are
      uncalled: merge_results has no caller, and it is the only caller of the
      other three.
    evidence:
      - "validate_file and #validate delegate to ValidationOrchestrator."
      - "add_error, add_warning, add_info and merge_results are private."
      - "merge_results is referenced once in lib/, spec/ and docs/: its definition."
  resolution_analyzer_recommendations:
    paths: ["analyzers/resolution_analyzer.rb"]
    classification: advisory-analysis
    decision: exclude
    rationale: >-
      The resolution analyzer returns optimization recommendations (Retina
      size, missing pHYs, large web image). They are analysis output, not
      conformance findings, and carry no requirement to cite.
    evidence:
      - "Messages are built as recommendation hashes in analyzers/resolution_analyzer.rb, not added to ValidationContext."
